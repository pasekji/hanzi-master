# Hanzi Master (demo) — stack pro sdílený demo VPS 169.58.178.25,
# nasazuje se do /opt/hanzi-master/. Postup: skill nasadit-na-vps.
#
# Předpoklad: externí síť `edge` už existuje (zakládá ji edge stack).
# Ven se nepublikuje ŽÁDNÝ port — dovnitř se chodí jen přes Caddy
# (vhost: /opt/edge/caddy/sites/hanzi-master.caddy).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    image: hanzi-master:demo
    container_name: hanzi-master
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    # Tajemství (MONGODB_URI, …) jen na serveru, chmod 600, v .deployignore.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://hanzi-master-mongo:27017/hanzi-master
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      edge:
      internal:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:7
    container_name: hanzi-master-mongo
    restart: unless-stopped
    # Mongo si jinak vezme cache podle RAM celého stroje, ne podle mem_limit.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    logging: *logging
    volumes:
      - mongo-data:/data/db
    # Jen vnitřní síť — z edge (a tedy z Caddy) na databázi vidět není.
    networks:
      internal:
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:

networks:
  edge:
    external: true
  internal:
    name: hanzi_master_internal
