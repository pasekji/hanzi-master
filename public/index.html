    /* ===== RESET & BASE ===== */

    /* ===== LOADING SCREEN ===== */

      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
    }

    .loading-screen::before {
      content: "学";
      position: absolute;
      right: max(14px, 12vw);
      top: 16%;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: clamp(120px, 34vw, 220px);
      font-weight: 900;
      color: rgba(7, 193, 96, 0.06);
      line-height: 1;
      pointer-events: none;
    }

    .loading-card {
      position: relative;
      z-index: 1;
      width: min(320px, calc(100vw - 48px));
      padding: 28px 22px 24px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 46px rgba(20, 49, 35, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .loading-panda {
      width: 104px;
      height: 104px;
      filter: drop-shadow(0 14px 20px rgba(7, 193, 96, 0.18));
      animation: loadingPulse 2.8s ease-in-out infinite;
    }
    
    .loading-text {
      margin-top: 2px;
      font-size: 18px;
      color: #14251c;
      font-weight: 900;
      letter-spacing: 0;
    }

    .loading-subtext {
      color: #687870;
      font-size: 13px;
      font-weight: 700;
    }

    .loading-dots {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .loading-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #07c160;
      animation: loadingBlink 1.2s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.16s;
      background: #1677ff;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.32s;
      background: #ffcf33;
    }
    
    @keyframes loadingPulse {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
    
    @keyframes loadingBlink {
      0%, 100% { transform: translateY(0); opacity: 0.45; }
      50% { transform: translateY(-4px); opacity: 1; }
    }
    
    .app-ready .loading-screen {
      display: none;
    }
    
    /* Selection color */
    ::selection {
      background: #07c160;
      color: #ffffff;
    }
    
    /* Focus visible for accessibility */
    :focus-visible {
      outline: 3px solid #1677ff;
      outline-offset: 2px;
    }
    
    /* Remove default button styles */
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    // Helper to migrate old ID-based progress to hanzi-based
    const migrateProgress = (data) => {
      // Check if already migrated (masteredChars contains strings/hanzi)
      if (data.masteredChars.length > 0 && typeof data.masteredChars[0] === 'string') {
        return data; // Already migrated
      }

      // Migrate IDs to hanzi
      const idToHanzi = {};
      VOCABULARY.forEach(v => { idToHanzi[v.id] = v.hanzi; });
      
      const migrated = {
        ...data,
        masteredChars: data.masteredChars.map(id => idToHanzi[id]).filter(Boolean),
        learningChars: data.learningChars.map(id => idToHanzi[id]).filter(Boolean),
        drawingAttempts: {}
      };
      
      // Migrate drawingAttempts keys
      if (data.drawingAttempts) {
        Object.entries(data.drawingAttempts).forEach(([id, count]) => {
          const hanzi = idToHanzi[parseInt(id)];
          if (hanzi) migrated.drawingAttempts[hanzi] = count;
        });
      }
      
      return migrated;
    };

      return [...vocab].sort((a, b) => {
        const priority = (char) => {
          if (!mastered.has(char.hanzi) && !learning.has(char.hanzi)) return 0;
          if (learning.has(char.hanzi)) return 1;
          return 2;
        };
        const diff = priority(a) - priority(b);
        return diff || a.id - b.id;
      });
    };

    const getDrawQueue = (vocab, progress) => {
      const mastered = getKnownSet(progress.masteredChars);
      const attempts = progress.drawingAttempts || {};
      return [...vocab].sort((a, b) => {
        const masteredDiff = Number(mastered.has(a.hanzi)) - Number(mastered.has(b.hanzi));
        if (masteredDiff) return masteredDiff;
        const attemptDiff = (attempts[a.hanzi] || 0) - (attempts[b.hanzi] || 0);
        return attemptDiff || a.id - b.id;
      });
    };

    const getTodayKey = () => new Date().toISOString().slice(0, 10);

    const getDailyTrainingQueue = (vocab, progress, limit = 8) => {
      const mastered = getKnownSet(progress.masteredChars);
      const learning = getKnownSet(progress.learningChars);
      const attempts = progress.drawingAttempts || {};
      const queue = [];
      const seen = new Set();
      const addBucket = (items, reason) => {
        items.forEach(char => {
          if (queue.length >= limit || seen.has(char.hanzi)) return;
          seen.add(char.hanzi);
          queue.push({ ...char, dailyReason: reason });
        });
      };
      const byPracticeNeed = (a, b) => {
        const attemptDiff = (attempts[a.hanzi] || 0) - (attempts[b.hanzi] || 0);
        return attemptDiff || a.lesson - b.lesson || a.id - b.id;
      };
      const learningChars = vocab
        .filter(char => learning.has(char.hanzi) && !mastered.has(char.hanzi))
        .sort(byPracticeNeed);
      const newChars = vocab
        .filter(char => !learning.has(char.hanzi) && !mastered.has(char.hanzi))
        .sort((a, b) => a.lesson - b.lesson || a.id - b.id);
      const reviewChars = vocab
        .filter(char => mastered.has(char.hanzi))
        .sort(byPracticeNeed);

      addBucket(learningChars, '复习');
      addBucket(newChars, '新字');
      addBucket(reviewChars, '巩固');
      return queue;
    };

    const getDailyTrainingSummary = (queue) => queue.reduce((summary, char) => {
      summary[char.dailyReason] = (summary[char.dailyReason] || 0) + 1;
      return summary;
    }, {});

    const getSimilarDistractors = (char, vocab, count = 3) => {
      const sameGroup = SIMILAR_CHAR_GROUPS.find(group => group.includes(char.hanzi)) || [];
      const byGroup = sameGroup
        .filter(hanzi => hanzi !== char.hanzi)
        .map(hanzi => vocab.find(v => v.hanzi === hanzi))
        .filter(Boolean);
      const byShape = vocab
        .filter(v => v.id !== char.id && !byGroup.some(g => g.id === v.id))
        .sort((a, b) => {
          const strokeDiff = Math.abs((a.strokes || 0) - (char.strokes || 0)) - Math.abs((b.strokes || 0) - (char.strokes || 0));
          return strokeDiff || Math.abs(a.id - char.id) - Math.abs(b.id - char.id);
        });
      return [...byGroup, ...byShape].slice(0, count);
    };

      /* ===== CHINESE SUPER-APP THEME ===== */
      :root {
        --bg-primary: #f5f7f6;
        --bg-secondary: #eef7f3;
        --bg-card: #ffffff;
        --accent-lime: #07c160;
        --accent-coral: #f24848;
        --accent-cyan: #1677ff;
        --accent-purple: #d99a18;
        --text-primary: #18212b;
        --text-secondary: #697780;
        --border-width: 1px;
        --border-color: #dce7e2;
        --radius: 8px;
        --shadow-offset: 0px;
        --transition-fast: 0.18s ease;
        --transition-bounce: 0.38s cubic-bezier(0.2, 0.9, 0.2, 1.2);
      }

      body {
        background:
          linear-gradient(180deg, #e8f7ef 0%, #f5f7f6 36%, #f7f8fb 100%);
        color: var(--text-primary);
        overflow-x: hidden;
      }

      html,
      body,
      #root {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      .app-container {
        background:
          radial-gradient(circle at 18% 8%, rgba(7, 193, 96, 0.16), transparent 28%),
          radial-gradient(circle at 86% 12%, rgba(22, 119, 255, 0.14), transparent 24%),
          linear-gradient(180deg, #e8f7ef 0%, #f5f7f6 42%, #f9faf8 100%);
        color: var(--text-primary);
        font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }

      .screen {
        width: min(calc(100vw - 24px), 460px);
        box-sizing: border-box;
        max-width: 460px;
        margin: 0 auto;
        padding: 18px;
        padding-bottom: calc(92px + env(safe-area-inset-bottom, 20px));
      }

      .screen *,
      .app-bottom-nav,
      .app-bottom-nav * {
        box-sizing: border-box;
      }

      @media (min-width: 768px) {
        .screen {
          max-width: 480px;
          padding: 24px;
          padding-bottom: 110px;
        }
      }

      .screen::before {
        content: "汉";
        position: fixed;
        top: 76px;
        right: max(12px, calc((100vw - 460px) / 2 - 24px));
        z-index: 0;
        font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        font-size: 116px;
        font-weight: 900;
        color: rgba(7, 193, 96, 0.06);
        animation: characterDrift 7s ease-in-out infinite;
        pointer-events: none;
      }

      .screen > * {
        position: relative;
        z-index: 1;
      }

      .header {
        padding: 10px 0 14px;
        margin-bottom: 10px;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #0d1f17;
        font-size: 30px;
        letter-spacing: 0;
        text-shadow: none;
        transform: none;
      }

      .logo::after {
        content: "Master";
        padding: 4px 9px;
        border-radius: 999px;
        background: linear-gradient(135deg, #07c160, #1677ff);
        color: #fff;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 12px;
        font-weight: 800;
      }

      .streak-badge,
      .back-btn,
      .btn,
      .draw-mode-btn,
      .quiz-option {
        border-radius: var(--radius);
        letter-spacing: 0;
        box-shadow: none;
      }

      .back-btn {
        background: rgba(255, 255, 255, 0.82);
        color: var(--text-primary);
        border-color: rgba(7, 193, 96, 0.2);
        font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
        font-size: 14px;
        font-weight: 800;
      }

      .card,
      .stat-item,
      .draw-stat,
      .hanzi-writer-container,
      .canvas-container,
      .quiz-option,
      .floating-indicator {
        border-color: rgba(24, 33, 43, 0.08);
        border-radius: var(--radius);
        box-shadow: 0 10px 28px rgba(20, 49, 35, 0.08);
      }

      .card {
        background: rgba(255, 255, 255, 0.94);
        padding: 18px;
        margin-bottom: 14px;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 3px;
        background: linear-gradient(90deg, #07c160, #1677ff, #d99a18);
        opacity: 0;
        transition: opacity var(--transition-fast);
      }

      .card-clickable:hover::before,
      .card-accent-lime::before,
      .card-accent-cyan::before,
      .card-accent-coral::before,
      .card-accent-purple::before {
        opacity: 1;
      }

      .card-clickable:active,
      .btn:active,
      .back-btn:active {
        transform: scale(0.985);
        box-shadow: 0 5px 14px rgba(20, 49, 35, 0.08);
      }

      @media (hover: hover) {
        .card-clickable:hover {
          transform: translateY(-2px);
          box-shadow: 0 14px 34px rgba(20, 49, 35, 0.12);
        }

        .btn-secondary:hover,
        .back-btn:hover {
          background: #ecfff5;
          color: #06783d;
        }
      }

      .card-accent-lime,
      .card-accent-cyan,
      .card-accent-coral,
      .card-accent-purple {
        border-color: rgba(24, 33, 43, 0.08);
        box-shadow: 0 12px 30px rgba(20, 49, 35, 0.1);
      }

      .title-hero {
        font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
        font-size: 44px;
        letter-spacing: 0;
        background: linear-gradient(135deg, #07c160 0%, #1677ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .title-xl {
        font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
        font-size: 32px;
        letter-spacing: 0;
      }

      .title-lg {
        font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
        font-size: 22px;
        letter-spacing: 0;
      }

      .title-md,
      .menu-label,
      .stat-label,
      .draw-stat-label,
      .score-label,
      .text-sm {
        letter-spacing: 0;
      }

      .text-sm {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .progress-bar {
        height: 8px;
        border: none;
        border-radius: 999px;
        background: #e3ebe7;
      }

      .progress-fill {
        border-radius: 999px;
        background: linear-gradient(90deg, #07c160, #1677ff);
      }

      .stats-bar {
        gap: 8px;
      }

      .stat-item {
        background: rgba(255, 255, 255, 0.76);
        padding: 12px 8px;
      }

      .stat-value,
      .draw-stat-value,
      .score-value,
      .lesson-number,
      .text-accent {
        color: #07c160;
      }

      .stat-value,
      .lesson-number,
      .score-value {
        font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
        font-size: 34px;
      }

      .menu-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .menu-item {
        min-height: 112px;
        padding: 16px;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.94), rgba(250,253,252,0.94));
      }

      .menu-icon {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(7, 193, 96, 0.14), rgba(22, 119, 255, 0.14));
        font-size: 28px;
        animation: iconBreathe 4s ease-in-out infinite;
      }

      .menu-label {
        font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
        font-size: 13px;
        font-weight: 900;
        color: #1d2c35;
      }

      .btn {
        min-height: 50px;
        border: none;
        font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
        font-size: 15px;
        font-weight: 900;
      }

      .btn-primary {
        background: linear-gradient(135deg, #07c160, #0aa75a);
        color: #fff;
        box-shadow: 0 10px 22px rgba(7, 193, 96, 0.24);
      }

      .btn-secondary {
        background: #ffffff;
        color: #1677ff;
        border: 1px solid rgba(22, 119, 255, 0.16);
      }

      .btn-coral,
      .quiz-option.incorrect,
      .draw-feedback.error {
        background: #fff1f0;
        color: #cf2b2b;
        border-color: #ffd2cf;
      }

      .hanzi-display {
        font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', 'SimSun', sans-serif;
      }

      .hanzi-hero {
        font-size: 116px;
        color: #07c160;
        animation: hanziFloat 5s ease-in-out infinite;
      }

      .hanzi-xl {
        font-size: 78px;
      }

      .pinyin-display {
        color: #1677ff;
      }

      .meaning-display {
        color: #5b6973;
      }

      .section-title {
        margin: 24px 0 12px;
      }

      .section-line {
        height: 1px;
        background: linear-gradient(90deg, rgba(7, 193, 96, 0.35), transparent);
      }

      .lesson-card {
        gap: 14px;
      }

      .lesson-number {
        min-width: 58px;
      }

      .draw-mode-selector {
        padding: 4px;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.74);
        box-shadow: inset 0 0 0 1px rgba(24, 33, 43, 0.06);
      }

      .draw-mode-btn {
        border: none;
        background: transparent;
        font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
        font-weight: 900;
        color: #65737d;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .draw-mode-btn svg {
        width: 18px;
        height: 18px;
      }

      .hanzi-writer-container .text-sm + svg,
      .hanzi-writer-container svg:first-child {
        max-width: 100%;
      }

      .hanzi-writer-container > div[style*="position: absolute"] svg {
        width: 46px;
        height: 46px;
      }

      .draw-mode-btn.active {
        background: #07c160;
        color: #fff;
        box-shadow: 0 7px 16px rgba(7, 193, 96, 0.2);
      }

      .hanzi-writer-container {
        background:
          linear-gradient(135deg, rgba(7, 193, 96, 0.04), rgba(22, 119, 255, 0.04)),
          #fff;
      }

      .stroke-dot {
        border: none;
        background: #d8e6df;
      }

      .stroke-dot.completed,
      .draw-feedback.success,
      .quiz-option.correct {
        background: #e8fff3;
        color: #087541;
        border-color: #b7f1d2;
      }

      .stroke-dot.current {
        background: #1677ff;
      }

      .draw-stat {
        background: rgba(255, 255, 255, 0.76);
      }

      .quiz-question {
        margin: 10px 0 14px;
        padding: 24px 16px;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 10px 28px rgba(20, 49, 35, 0.08);
      }

      .quiz-option {
        padding: 15px 16px;
        background: #fff;
        font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
        box-shadow: 0 8px 18px rgba(20, 49, 35, 0.06);
      }

      .quiz-feedback {
        border-radius: var(--radius);
        border-color: rgba(22, 119, 255, 0.16);
        background: #f0f7ff;
        color: #17344d;
      }

      .flashcard {
        min-height: 310px;
        background:
          radial-gradient(circle at 50% 24%, rgba(7, 193, 96, 0.13), transparent 35%),
          #fff;
      }

      .flashcard-hint {
        color: #84929a;
      }

      .char-item {
        border: none;
        border-radius: 6px;
        background: #edf3ef;
      }

      .char-item.mastered {
        background: #07c160;
        color: #fff;
      }

      .char-item.learning {
        background: #1677ff;
        color: #fff;
      }

      .streak-badge {
        background: #fff7e6;
        color: #9a6400;
        border: 1px solid #ffe2a8;
        font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
      }

      .floating-indicator {
        background: rgba(255, 255, 255, 0.96);
        border-color: rgba(7, 193, 96, 0.2);
      }

      .app-mascot {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
        align-items: center;
        padding: 14px;
        margin-bottom: 14px;
        border-radius: var(--radius);
        background:
          linear-gradient(135deg, rgba(7, 193, 96, 0.12), rgba(22, 119, 255, 0.1)),
          rgba(255, 255, 255, 0.82);
        box-shadow: 0 10px 24px rgba(20, 49, 35, 0.08);
        animation: slideUp 0.35s ease-out;
      }

      .app-mascot-face {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #07c160, #1677ff);
        color: #fff;
        font-family: 'Noto Sans SC', sans-serif;
        font-size: 34px;
        font-weight: 900;
        box-shadow: 0 10px 18px rgba(7, 193, 96, 0.24);
        animation: mascotPulse 3.4s ease-in-out infinite;
      }

      .app-mascot-title {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 900;
        color: #1d2c35;
      }

      .app-mascot-subtitle {
        margin: 0;
        font-size: 12px;
        color: #5f6e77;
      }

      @keyframes characterDrift {
        0%, 100% { transform: translateY(0) rotate(-5deg); }
        50% { transform: translateY(18px) rotate(3deg); }
      }

      @keyframes iconBreathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-3px) scale(1.04); }
      }

      @keyframes mascotPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      /* ===== UTILITY ANIMATIONS ===== */
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-slide-up {
        animation: slideUp 0.35s ease-out;
      }

      /* ===== FULL PRODUCT REDESIGN ===== */
      .app-container {
        position: relative;
        min-height: 100vh;
      }

      .screen {
        padding-top: 22px;
        padding-bottom: calc(118px + env(safe-area-inset-bottom, 20px));
      }

      .app-container::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(7, 193, 96, 0.12), transparent 220px),
          repeating-linear-gradient(135deg, rgba(7, 193, 96, 0.025) 0 1px, transparent 1px 18px);
        pointer-events: none;
      }

      .super-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: transparent;
      }

      .hanzi-mascot-svg {
        width: 58px;
        height: 58px;
        filter: drop-shadow(0 12px 22px rgba(7, 193, 96, 0.22));
        animation: mascotPulse 3.4s ease-in-out infinite;
      }

      .brand-title {
        margin: 0;
        font-size: 20px;
        line-height: 1;
        font-weight: 900;
        color: #14251c;
      }

      .brand-subtitle {
        margin: 4px 0 0;
        color: #6c7a73;
        font-size: 12px;
      }

      .daily-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 34px;
        padding: 0 11px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(217, 154, 24, 0.22);
        color: #9a6400;
        font-weight: 900;
        box-shadow: 0 8px 20px rgba(154, 100, 0, 0.08);
      }

      .wallet-card {
        position: relative;
        min-height: 188px;
        padding: 20px;
        border-radius: 8px;
        overflow: hidden;
        background:
          linear-gradient(135deg, rgba(7, 193, 96, 0.96), rgba(22, 119, 255, 0.88)),
          #07c160;
        color: #fff;
        box-shadow: 0 18px 40px rgba(7, 193, 96, 0.24);
        animation: walletEnter 0.48s ease-out;
      }

      .wallet-card::before {
        content: "学";
        position: absolute;
        right: -10px;
        top: -28px;
        font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        font-size: 180px;
        font-weight: 900;
        color: rgba(255,255,255,0.11);
        line-height: 1;
      }

      .wallet-card::after {
        content: "";
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 18px;
        height: 1px;
        background: rgba(255,255,255,0.28);
      }

      .wallet-label {
        margin: 0;
        color: rgba(255,255,255,0.78);
        font-size: 12px;
        font-weight: 800;
      }

      .wallet-score {
        margin: 8px 0 16px;
        font-size: 56px;
        line-height: 0.9;
        font-weight: 900;
        letter-spacing: -1px;
      }

      .wallet-card .progress-bar {
        background: rgba(255,255,255,0.25);
      }

      .wallet-card .progress-fill {
        background: #fff;
      }

      .wallet-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        color: rgba(255,255,255,0.86);
        font-size: 12px;
      }

      .wallet-seal {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 1px solid rgba(255,255,255,0.36);
        border-radius: 8px;
        color: #fff;
        font-family: 'Noto Sans SC', sans-serif;
        font-size: 24px;
        font-weight: 900;
      }

      .daily-entry-card {
        position: relative;
        display: grid;
        gap: 12px;
        margin: 14px 0 16px;
        padding: 14px;
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255,255,255,0.96), rgba(232, 255, 243, 0.92));
        border: 1px solid rgba(7, 193, 96, 0.12);
        box-shadow: 0 14px 34px rgba(20, 49, 35, 0.09);
        cursor: pointer;
        overflow: hidden;
      }

      .daily-entry-card::after {
        content: "练";
        position: absolute;
        right: -4px;
        bottom: -24px;
        color: rgba(7, 193, 96, 0.07);
        font-family: 'Noto Sans SC', sans-serif;
        font-size: 104px;
        font-weight: 900;
        line-height: 1;
      }

      .daily-entry-main {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: center;
      }

      .daily-entry-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: #fff;
        background: linear-gradient(135deg, #07c160, #1677ff);
        box-shadow: 0 10px 20px rgba(7, 193, 96, 0.18);
      }

      .daily-entry-kicker {
        margin: 0 0 2px;
        color: #07a653;
        font-size: 12px;
        font-weight: 900;
      }

      .daily-entry-title {
        margin: 0;
        color: #14251c;
        font-size: 16px;
        font-weight: 900;
        line-height: 1.2;
      }

      .daily-entry-strip {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 6px;
        overflow: hidden;
      }

      .daily-entry-char {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border-radius: 8px;
        background: #fff;
        color: #07a653;
        font-family: 'Noto Sans SC', sans-serif;
        font-size: 22px;
        font-weight: 900;
        box-shadow: inset 0 0 0 1px rgba(7, 193, 96, 0.08);
      }

      .daily-entry-meta {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 8px;
        color: #687870;
        font-size: 11px;
        font-weight: 800;
      }

      .quick-lane {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin: 14px 0 20px;
      }

      .quick-action {
        min-width: 0;
        min-height: 82px;
        padding: 0 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: 8px;
        background: rgba(255,255,255,0.92);
        color: #1c2b34;
        box-shadow: 0 10px 26px rgba(20, 49, 35, 0.08);
        font-weight: 900;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .quick-action:active {
        transform: translateY(2px) scale(0.98);
      }

      .quick-action-icon {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #e8fff3;
        color: #07a653;
      }

      .quick-action-icon svg,
      .bottom-nav-icon svg {
        width: 22px;
        height: 22px;
      }

      .quick-action:nth-child(2) .quick-action-icon {
        background: #eef5ff;
      }

      .quick-action:nth-child(3) .quick-action-icon {
        background: #fff4e0;
      }

      .quick-action:nth-child(4) .quick-action-icon {
        background: #fff0f0;
      }

      .quick-action-label {
        font-size: 11px;
      }

      .insight-panel {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 16px;
        margin-bottom: 18px;
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255,255,255,0.96), rgba(240, 255, 248, 0.96));

    // ============================================
    // MAIN APP
    // ============================================
    function HanziMasterApp() {
      const [currentView, setCurrentView] = React.useState('home');
      const [progress, setProgress] = React.useState(loadProgress);
      const [selectedLesson, setSelectedLesson] = React.useState(null);
      const [selectedQueue, setSelectedQueue] = React.useState(null);

      React.useEffect(() => {
        saveProgress(progress);
      }, [progress]);

      React.useEffect(() => {
        const today = new Date().toDateString();
        if (progress.lastStudyDate !== today) {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          const wasYesterday = progress.lastStudyDate === yesterday.toDateString();
          setProgress(prev => ({
            ...prev,
            lastStudyDate: today,
            streakDays: wasYesterday ? prev.streakDays + 1 : (prev.lastStudyDate ? 1 : 1),
          }));
        }
      }, []);

      const updateProgress = React.useCallback((updates) => {
        setProgress(prev => ({ ...prev, ...updates }));
      }, []);

      const markCharacterLearned = React.useCallback((hanzi) => {
        setProgress(prev => {
          if (prev.learningChars.includes(hanzi)) return { ...prev, totalReviews: prev.totalReviews + 1 };
          return { ...prev, learningChars: [...prev.learningChars, hanzi], totalReviews: prev.totalReviews + 1 };
        });
      }, []);

      const markCharacterMastered = React.useCallback((hanzi) => {
        setProgress(prev => {
          if (prev.masteredChars.includes(hanzi)) return prev;
          return {
            ...prev,
            masteredChars: [...prev.masteredChars, hanzi],
            learningChars: prev.learningChars.filter(h => h !== hanzi)
          };
        });
      }, []);

      const viewProps = { progress, setCurrentView, selectedLesson, setSelectedLesson, selectedQueue, setSelectedQueue, updateProgress, markCharacterLearned, markCharacterMastered };

      return (
        <div className="app-container">
          <style>{styles}</style>
          {currentView === 'home' && <HomeView {...viewProps} />}
          {currentView === 'daily' && <DailyTrainingView {...viewProps} />}
          {currentView === 'lessons' && <LessonsView {...viewProps} />}
          {currentView === 'learn' && <LearnView {...viewProps} />}
          {currentView === 'draw' && <DrawView {...viewProps} />}
          {currentView === 'quiz' && <QuizView {...viewProps} />}
          {currentView === 'stats' && <StatsView {...viewProps} />}
          <BottomNav currentView={currentView} setCurrentView={setCurrentView} setSelectedLesson={setSelectedLesson} setSelectedQueue={setSelectedQueue} />
        </div>
      );
    }

    function BottomNav({ currentView, setCurrentView, setSelectedLesson, setSelectedQueue }) {
      if (['learn', 'draw', 'quiz', 'daily'].includes(currentView)) return null;

      const items = [
        { view: 'home', icon: 'home', label: '首页' },
        { view: 'learn', icon: 'card', label: '卡片', resetLesson: true },
        { view: 'draw', icon: 'brush', label: '写字', resetLesson: true },
        { view: 'quiz', icon: 'target', label: '测验', resetLesson: true },
        { view: 'stats', icon: 'chart', label: '钱包' },
      ];

      return (
        <nav className="app-bottom-nav" aria-label="Primary">
          {items.map(item => (
            <button
              key={item.view}
              className={`bottom-nav-item ${currentView === item.view ? 'active' : ''}`}
              onClick={() => {
                if (item.resetLesson) setSelectedLesson(null);
                setSelectedQueue(null);
                setCurrentView(item.view);
              }}
            >
              <span className="bottom-nav-icon"><AppIcon name={item.icon} /></span>
              <span>{item.label}</span>
            </button>
          ))}
        </nav>
      );
    }

    function LearnView({ selectedLesson, selectedQueue, progress, markCharacterLearned, updateProgress, setCurrentView }) {

      const [vocab] = React.useState(() => getStudyQueue(baseVocab, progress));
      const positionKey = `learn:${selectedQueue?.id || selectedLesson || 'all'}`;
      const scopePill = selectedQueue?.label || (selectedLesson ? `L${selectedLesson}` : '全部');
      const [currentIndex, setCurrentIndex] = React.useState(() => Math.min(progress.lastPositions?.[positionKey] || 0, Math.max(vocab.length - 1, 0)));
      const [isFlipped, setIsFlipped] = React.useState(false);
      const [showCompound, setShowCompound] = React.useState(false);

      const currentChar = vocab[currentIndex];
      const relatedCompounds = React.useMemo(() => COMPOUNDS.filter(c => c.hanzi.includes(currentChar.hanzi)), [currentChar]);

      const handleNext = () => {
        markCharacterLearned(currentChar.hanzi);
        setIsFlipped(false);
        setShowCompound(false);
        if (currentIndex < vocab.length - 1) {
          const nextIndex = currentIndex + 1;
          updateProgress({ lastPositions: { ...(progress.lastPositions || {}), [positionKey]: nextIndex } });
          setCurrentIndex(nextIndex);
        } else {
          updateProgress({ lastPositions: { ...(progress.lastPositions || {}), [positionKey]: 0 } });
        }
      };

      const handlePrev = () => {
        setIsFlipped(false);
        setShowCompound(false);
        if (currentIndex > 0) {
          const prevIndex = currentIndex - 1;
          updateProgress({ lastPositions: { ...(progress.lastPositions || {}), [positionKey]: prevIndex } });
          setCurrentIndex(prevIndex);
        }
      };

      return (
        <div className="screen">
          <header className="header">
            <button className="back-btn" onClick={() => setCurrentView('home')}>← 返回</button>

            icon="card"
            title="生词卡片"
            subtitle="先回忆，再翻开。把会认的字变成会用的字。"

          />

            <span className="mini-app-progress-count">{currentIndex + 1} / {vocab.length}</span>

            <div className="progress-fill" style={{ width: `${((currentIndex + 1) / vocab.length) * 100}%` }} />
          </div>

            {isFlipped && (
              <div className="animate-slide-up" style={{ textAlign: 'center' }}>
                <div className="pinyin-display">{currentChar.pinyin}</div>
                <div className="meaning-display">{currentChar.meaning}</div>
                <p className="text-sm" style={{ marginTop: '12px' }}>{currentChar.strokes} 笔画 • L{currentChar.lesson}</p>
              </div>
            )}
            {!isFlipped && <p className="flashcard-hint">轻点翻开</p>}
          </div>

          {relatedCompounds.length > 0 && (
            <div className="related-service-card card card-clickable" onClick={() => setShowCompound(!showCompound)} role="button" tabIndex={0}>
              <p className="title-md">相关词 ({relatedCompounds.length})</p>
              {showCompound && (
                <div className="animate-slide-up" style={{ marginTop: '12px' }}>
                  {relatedCompounds.map((c, i) => (
                    <div key={i} style={{ padding: '8px 0', borderBottom: i < relatedCompounds.length - 1 ? '1px solid #dce7e2' : 'none' }}>
                      <span className="hanzi-display hanzi-md">{c.hanzi}</span>
                      <span style={{ marginLeft: '12px', color: 'var(--accent-cyan)' }}>{c.pinyin}</span>
                      <span style={{ marginLeft: '12px', color: 'var(--text-secondary)', fontSize: '14px' }}>{c.meaning}</span>

          <div className="nav-actions">
            <button className="btn btn-secondary" onClick={handlePrev} disabled={currentIndex === 0}>← 上一张</button>

    // ============================================
    // DRAW VIEW
    // ============================================
    function DrawView({ selectedLesson, selectedQueue, progress, updateProgress, markCharacterMastered, setCurrentView }) {
      const baseVocab = React.useMemo(() => selectedQueue?.items?.length ? selectedQueue.items : (selectedLesson ? VOCABULARY.filter(v => v.lesson === selectedLesson) : VOCABULARY), [selectedLesson, selectedQueue]);
      const [vocab] = React.useState(() => getDrawQueue(baseVocab, progress));
      const positionKey = `draw:${selectedQueue?.id || selectedLesson || 'all'}`;
      const scopePill = selectedQueue?.label || (selectedLesson ? `L${selectedLesson}` : '全部');
      const [currentIndex, setCurrentIndex] = React.useState(() => Math.min(progress.lastPositions?.[positionKey] || 0, Math.max(vocab.length - 1, 0)));
      const [drawMode, setDrawMode] = React.useState('practice'); // learn, practice, quiz
      const [showReference, setShowReference] = React.useState(false);
      const [strokesCompleted, setStrokesCompleted] = React.useState(0);
      const [totalStrokes, setTotalStrokes] = React.useState(0);
      const [mistakes, setMistakes] = React.useState(0);
      const mistakesRef = React.useRef(0);
      const [feedback, setFeedback] = React.useState(null); // { type: 'success' | 'error', message }
      const [isComplete, setIsComplete] = React.useState(false);
      const [isLoading, setIsLoading] = React.useState(true);
      const [charStats, setCharStats] = React.useState({ completed: 0, totalMistakes: 0 });
      
      const writerRef = React.useRef(null);
      const containerRef = React.useRef(null);
      const currentChar = vocab[currentIndex];

      // Initialize Hanzi Writer
      React.useEffect(() => {
        if (!containerRef.current || !currentChar) return;
        
        // Clear previous
        if (writerRef.current) {
          writerRef.current = null;
        }
        containerRef.current.innerHTML = '';
        
        // Reset state
        setStrokesCompleted(0);
        setMistakes(0);
        mistakesRef.current = 0;
        setFeedback(null);
        setIsComplete(false);
        setIsLoading(true);

        // Calculate size based on container
        const containerWidth = containerRef.current.parentElement.offsetWidth - 20;
        const size = Math.min(containerWidth, 320);

        try {
          const writer = HanziWriter.create(containerRef.current, currentChar.hanzi, {
            width: size,
            height: size,
            padding: 10,
            showOutline: drawMode === 'learn' || showReference,
            showCharacter: drawMode === 'learn' || showReference,
            strokeColor: '#07c160',
            outlineColor: '#dce7e2',
            drawingColor: '#07c160',
            highlightColor: '#1677ff',
            radicalColor: '#07c160',
            strokeAnimationSpeed: 1,
            delayBetweenStrokes: 300,
            drawingWidth: 6,
            showHintAfterMisses: drawMode === 'practice' ? 2 : 3,
            highlightOnComplete: true,
            charDataLoader: (char, onComplete) => {
              fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${char}.json`)
                .then(res => res.json())
                .then(data => onComplete(data))
                .catch(() => {
                  setFeedback({ type: 'error', message: '暂时没有笔画数据' });
                });
            }
          });

          writerRef.current = writer;

          // Get stroke count
          fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${currentChar.hanzi}.json`)
            .then(res => res.json())
            .then(data => {
              setTotalStrokes(data.strokes.length);
              setIsLoading(false);
            })
            .catch(() => {
              setTotalStrokes(currentChar.strokes);
              setIsLoading(false);
            });

          // Start based on mode
          if (drawMode === 'learn') {
            // Just show the character, user can click animate
          } else {
            // Start quiz mode for practice and quiz
            setTimeout(() => {
              writer.quiz({
                onCorrectStroke: (data) => {
                  setStrokesCompleted(data.strokeNum + 1);
                  if (data.strokeNum === 0) {
                    setFeedback({ type: 'success', message: '开头很好' });
                  }
                  setTimeout(() => setFeedback(null), 800);
                },
                onMistake: (data) => {
                  mistakesRef.current += 1;
                  setMistakes(prev => prev + 1);
                  setFeedback({ type: 'error', message: '再试一次' });
                  setTimeout(() => setFeedback(null), 800);
                },
                onComplete: (data) => {
                  setIsComplete(true);
                  const finalMistakes = mistakesRef.current;
                  setCharStats(prev => ({
                    completed: prev.completed + 1,
                    totalMistakes: prev.totalMistakes + finalMistakes
                  }));
                  if (finalMistakes === 0) {
                    setFeedback({ type: 'success', message: '🎉 完美' });
                    markCharacterMastered(currentChar.hanzi);
                  } else if (finalMistakes <= 2) {
                    setFeedback({ type: 'success', message: '👍 写得不错' });
                  } else {
                    setFeedback({ type: 'success', message: '✓ 完成' });
                  }
                }
              });
            }, 300);
          }
        } catch (err) {
          console.warn('Hanzi Writer init error:', err);
        }

        return () => {
          if (writerRef.current) {
            writerRef.current = null;
          }
        };
      }, [currentChar, drawMode, showReference]);

      const handleAnimate = () => {
        if (writerRef.current) {
          writerRef.current.animateCharacter();
        }
      };

      const handleReset = () => {
        setStrokesCompleted(0);
        setMistakes(0);
        mistakesRef.current = 0;
        setFeedback(null);
        setIsComplete(false);
        
        if (writerRef.current) {
          if (drawMode === 'learn') {
            writerRef.current.showCharacter();
          } else {
            writerRef.current.quiz({
              onCorrectStroke: (data) => {
                setStrokesCompleted(data.strokeNum + 1);
                setFeedback({ type: 'success', message: '很好' });
                setTimeout(() => setFeedback(null), 600);
              },
              onMistake: () => {
                mistakesRef.current += 1;
                setMistakes(prev => prev + 1);
                setFeedback({ type: 'error', message: '再试一次' });
                setTimeout(() => setFeedback(null), 600);
              },
              onComplete: () => {
                setIsComplete(true);
                const finalMistakes = mistakesRef.current;
                setCharStats(prev => ({
                  completed: prev.completed + 1,
                  totalMistakes: prev.totalMistakes + finalMistakes
                }));
                setFeedback({ type: 'success', message: finalMistakes === 0 ? '🎉 完美' : '✓ 完成' });
              }
            });
          }
        }
      };

      const handleNext = () => {
        const nextIndex = currentIndex < vocab.length - 1 ? currentIndex + 1 : 0;
        updateProgress({ 
          drawingAttempts: { 
            ...progress.drawingAttempts, 
            [currentChar.hanzi]: (progress.drawingAttempts[currentChar.hanzi] || 0) + 1 
          },
          lastPositions: { ...(progress.lastPositions || {}), [positionKey]: nextIndex }
        });
        if (currentIndex < vocab.length - 1) {
          setCurrentIndex(nextIndex);
        } else {
          // Last character - go back to home
          setCurrentView('home');
        }
      };

      const handlePrev = () => {
        if (currentIndex > 0) {
          const prevIndex = currentIndex - 1;
          updateProgress({ lastPositions: { ...(progress.lastPositions || {}), [positionKey]: prevIndex } });
          setCurrentIndex(prevIndex);
        }
      };

      // Stroke dots for visual progress
      const strokeDots = React.useMemo(() => {
        const dots = [];
        for (let i = 0; i < Math.min(totalStrokes, 12); i++) {
          let className = 'stroke-dot';
          if (i < strokesCompleted) className += ' completed';
          else if (i === strokesCompleted && !isComplete) className += ' current';
          dots.push(<div key={i} className={className} />);
        }
        if (totalStrokes > 12) {
          dots.push(<span key="more" style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>+{totalStrokes - 12}</span>);
        }
        return dots;
      }, [totalStrokes, strokesCompleted, isComplete]);

      return (
        <div className="screen">
          <header className="header">
            <button className="back-btn" onClick={() => setCurrentView('home')}>← 返回</button>
            <span className="text-sm" style={{ color: 'var(--accent-coral)' }}>第 {currentIndex + 1} 字</span>
          </header>

          <MiniAppHeader
            icon="brush"
            title="写字练习"
            subtitle="先凭记忆写，再打开提示。笔顺会帮你慢慢修正。"
            pill={scopePill}
          />

          {/* Mode selector */}
          <div className="mini-app-segment draw-mode-selector">
            <button 
              className={`draw-mode-btn ${drawMode === 'learn' ? 'active' : ''}`}
              onClick={() => setDrawMode('learn')}
            >
              <AppIcon name="card" /> 学
            </button>
            <button 
              className={`draw-mode-btn ${drawMode === 'practice' ? 'active' : ''}`}
              onClick={() => setDrawMode('practice')}
            >
              <AppIcon name="brush" /> 练
            </button>
            <button 
              className={`draw-mode-btn ${drawMode === 'quiz' ? 'active' : ''}`}
              onClick={() => setDrawMode('quiz')}
            >
              <AppIcon name="target" /> 测
            </button>
          </div>

          {/* Character info */}
          <div className="draw-prompt-card card" style={{ textAlign: 'center', padding: '16px' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '16px' }}>
              <div className="hanzi-display" style={{ fontSize: '48px', color: 'var(--accent-lime)', minWidth: '64px' }}>
                {(drawMode === 'learn' || showReference) ? currentChar.hanzi : '?'}
              </div>
              <div style={{ textAlign: 'left' }}>
                <div className="pinyin-display" style={{ fontSize: '20px', marginTop: 0 }}>{currentChar.pinyin}</div>
                <p className="text-sm" style={{ margin: '4px 0 0 0' }}>{currentChar.meaning}</p>
              </div>
            </div>
          </div>

          {/* Hanzi Writer container */}
          <div className="writer-mini-program hanzi-writer-container">
            {isLoading && (
              <div style={{ position: 'absolute', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px' }}>
                <div style={{ color: '#07c160', animation: 'loadingPulse 1s ease-in-out infinite' }}><AppIcon name="brush" /></div>
                <div className="text-sm">笔画准备中...</div>
              </div>
            )}
            <div ref={containerRef} style={{ touchAction: 'none', opacity: isLoading ? 0 : 1 }} />
            {feedback && (
              <div className={`draw-feedback ${feedback.type}`}>
                {feedback.message}
              </div>
            )}
          </div>

          {/* Stroke progress */}
          {drawMode !== 'learn' && totalStrokes > 0 && (
            <div className="stroke-counter">
              {strokeDots}
            </div>
          )}

          {/* Controls based on mode */}
          <div className="canvas-controls">
            {drawMode === 'learn' ? (
              <>
                <button className="btn btn-secondary" onClick={handleAnimate}>▶ 看笔顺</button>
                <button className="btn btn-primary" onClick={handleNext}>
                  {currentIndex === vocab.length - 1 ? '完成' : '下一字 →'}
                </button>
              </>
            ) : (
              <>
                <button className="btn btn-secondary" onClick={handleReset}>
                  {isComplete ? '↺ 再写' : '↺ 重写'}
                </button>
                <button className="btn btn-secondary" onClick={() => setShowReference(prev => !prev)}>
                  {showReference ? '隐藏' : '提示'}
                </button>
                {isComplete && (
                  <button className="btn btn-primary" onClick={handleNext}>
                    {currentIndex === vocab.length - 1 ? '完成' : '下一字 →'}
                  </button>
                )}
              </>
            )}
          </div>

          {/* Stats */}
          {drawMode !== 'learn' && (
            <div className="draw-stats">
              <div className="draw-stat">
                <div className="draw-stat-value">{strokesCompleted}/{totalStrokes}</div>
                <div className="draw-stat-label">笔画</div>
              </div>
              <div className="draw-stat">
                <div className="draw-stat-value" style={{ color: mistakes > 0 ? 'var(--accent-coral)' : 'var(--accent-lime)' }}>{mistakes}</div>
                <div className="draw-stat-label">错笔</div>
              </div>
              <div className="draw-stat">
                <div className="draw-stat-value">{charStats.completed}</div>
                <div className="draw-stat-label">完成</div>
              </div>
            </div>
          )}

          {/* Navigation */}
          <div className="nav-actions">
            <button className="btn btn-secondary" onClick={handlePrev} disabled={currentIndex === 0}>← 上一字</button>
            {(drawMode === 'learn' || !isComplete) && (
              <button className="btn btn-secondary" onClick={handleNext}>
                跳过 →
              </button>
            )}
          </div>
        </div>
      );
    }

    // ============================================
    // QUIZ VIEW
    // ============================================
    function QuizView({ selectedLesson, selectedQueue, progress, updateProgress, markCharacterMastered, setCurrentView }) {
      const baseVocab = React.useMemo(() => selectedQueue?.items?.length ? selectedQueue.items : (selectedLesson ? VOCABULARY.filter(v => v.lesson === selectedLesson) : VOCABULARY), [selectedLesson, selectedQueue]);
      const [vocab] = React.useState(() => getStudyQueue(baseVocab, progress));
      const [initialMasteredChars] = React.useState(progress.masteredChars);
      const scopePill = selectedQueue?.label || (selectedLesson ? `L${selectedLesson}` : '练习');
      const [questions, setQuestions] = React.useState([]);
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const [attemptedAnswers, setAttemptedAnswers] = React.useState([]);
      const [answeredCorrect, setAnsweredCorrect] = React.useState(false);
      const [revealedAnswer, setRevealedAnswer] = React.useState(false);
      const [score, setScore] = React.useState(0);
      const [isComplete, setIsComplete] = React.useState(false);
      const [quizType, setQuizType] = React.useState(null);

      const generateQuestions = React.useCallback(() => {
        const mastered = getKnownSet(initialMasteredChars);
        const weakPool = vocab.filter(v => !mastered.has(v.hanzi));
        const source = weakPool.length >= 4 ? weakPool : vocab;
        const shuffled = [...source].sort(() => Math.random() - 0.5).slice(0, Math.min(10, source.length));
        const qs = shuffled.map(char => {
          const similar = getSimilarDistractors(char, vocab, 3);
          const fill = vocab
            .filter(v => v.id !== char.id && !similar.some(s => s.id === v.id))
            .sort(() => Math.random() - 0.5);
          const wrong = [...similar, ...fill].slice(0, 3);
          let opts;
          if (quizType === 'hanzi-to-pinyin') {
            opts = [{ text: char.pinyin, isCorrect: true }, ...wrong.map(w => ({ text: w.pinyin, isCorrect: false }))];
          } else if (quizType === 'pinyin-to-hanzi') {
            opts = [{ text: char.hanzi, isCorrect: true }, ...wrong.map(w => ({ text: w.hanzi, isCorrect: false }))];
          } else {
            opts = [{ text: char.meaning, isCorrect: true }, ...wrong.map(w => ({ text: w.meaning, isCorrect: false }))];
          }
          const uniqueOpts = [];
          opts.forEach(opt => {
            if (!uniqueOpts.some(existing => existing.text === opt.text)) uniqueOpts.push(opt);
          });
          return { char, options: uniqueOpts.sort(() => Math.random() - 0.5), type: quizType };
        });
        setQuestions(qs);
        setCurrentIndex(0);
        setScore(0);
        setAttemptedAnswers([]);
        setAnsweredCorrect(false);
        setRevealedAnswer(false);
        setIsComplete(false);
      }, [vocab, quizType, initialMasteredChars]);

      React.useEffect(() => {
        if (quizType) generateQuestions();
      }, [quizType, generateQuestions]);

      const handleAnswer = (option) => {
        if (answeredCorrect || revealedAnswer || attemptedAnswers.some(a => a.text === option.text)) return;
        if (option.isCorrect) {
          const newScore = score + 1;
          setScore(newScore);
          setAnsweredCorrect(true);
          markCharacterMastered(questions[currentIndex].char.hanzi);
          return;
        }
        const nextAttempts = [...attemptedAnswers, option];
        setAttemptedAnswers(nextAttempts);
        if (nextAttempts.length >= 2) {
          setRevealedAnswer(true);
        }
      };

      const handleNextQuestion = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setAttemptedAnswers([]);
          setAnsweredCorrect(false);
          setRevealedAnswer(false);
        } else {
          setIsComplete(true);
          updateProgress({ quizScores: [...progress.quizScores, { score, total: questions.length, date: new Date().toISOString() }] });
        }
      };

      if (!quizType) {
        return (
          <div className="screen">
            <header className="header">
              <button className="back-btn" onClick={() => setCurrentView('home')}>← 返回</button>
              <div className="logo">汉字</div>
            </header>
            <MiniAppHeader
            icon="target"
            title="每日测验"
            subtitle="先给自己一次机会，第二次再看答案。"
            pill={scopePill}
          />
            <div className="card card-clickable card-accent-lime quiz-mode-card" onClick={() => setQuizType('hanzi-to-pinyin')} role="button" tabIndex={0}>
              <span className="quiz-mode-icon"><AppIcon name="sound" /></span>
              <div>
                <p className="title-lg">汉字 → 拼音</p>
                <p className="text-sm">看汉字，猜读音</p>
              </div>
            </div>
            <div className="card card-clickable card-accent-cyan quiz-mode-card" onClick={() => setQuizType('pinyin-to-hanzi')} role="button" tabIndex={0}>
              <span className="quiz-mode-icon"><AppIcon name="target" /></span>
              <div>
                <p className="title-lg">拼音 → 汉字</p>
                <p className="text-sm">看拼音，选汉字</p>
              </div>
            </div>
            <div className="card card-clickable card-accent-coral quiz-mode-card" onClick={() => setQuizType('hanzi-to-meaning')} role="button" tabIndex={0}>
              <span className="quiz-mode-icon"><AppIcon name="book" /></span>
              <div>
                <p className="title-lg">汉字 → 意思</p>
                <p className="text-sm">看汉字，猜英文意思</p>
              </div>
            </div>
          </div>
        );
      }

      if (isComplete) {
        const pct = Math.round((score / questions.length) * 100);
        return (
          <div className="screen">
            <header className="header">
              <button className="back-btn" onClick={() => setCurrentView('home')}>← 返回</button>
            </header>
            <div className="results-display">
              <div className="score-circle">
                <div className="score-value">{pct}%</div>
                <div className="score-label">得分</div>
              </div>
              <h2 className="title-xl">{pct >= 80 ? '🎉 太棒了!' : pct >= 60 ? '👍 很不错!' : '💪 继续练!'}</h2>
              <p className="text-sm" style={{ marginTop: '12px' }}>{score} / {questions.length} 答对</p>
            </div>
            <div className="nav-actions">
              <button className="btn btn-secondary" onClick={() => setQuizType(null)}>换题型</button>
              <button className="btn btn-primary" onClick={generateQuestions}>再测一次</button>
            </div>
          </div>
        );
      }

      const q = questions[currentIndex];
      if (!q) return null;
      const canContinue = answeredCorrect || revealedAnswer;
      const correctOption = q.options.find(opt => opt.isCorrect);

      return (
        <div className="screen">
          <header className="header">
            <button className="back-btn" onClick={() => setCurrentView('home')}>← 返回</button>
            <span className="text-sm" style={{ color: 'var(--accent-purple)' }}>{currentIndex + 1} / {questions.length}</span>
          </header>
          <MiniAppHeader
            icon="target"
            title="每日测验"
            subtitle="答错一次不会立刻公布答案，再想一次。"
            pill={`${score} 分`}
          />
          <div className="progress-bar">
            <div className="progress-fill" style={{ width: `${(currentIndex / questions.length) * 100}%` }} />
          </div>
          <div className="quiz-question quiz-pass-card">
            {q.type === 'pinyin-to-hanzi' ? (
              <>
                <p className="text-sm">这是哪个汉字？</p>
                <div className="pinyin-display" style={{ fontSize: '42px', marginTop: '16px' }}>{q.char.pinyin}</div>
                <p className="meaning-display">{q.char.meaning}</p>
              </>
            ) : (
              <>
                <p className="text-sm">{q.type === 'hanzi-to-pinyin' ? '这个字怎么读？' : '这个字是什么意思？'}</p>
                <div className="hanzi-display hanzi-xl" style={{ color: 'var(--accent-lime)' }}>{q.char.hanzi}</div>
              </>
            )}
          </div>
          <div className="quiz-options service-list">
            {q.options.map((opt, i) => {
              const wasTried = attemptedAnswers.some(a => a.text === opt.text);
              const showCorrect = canContinue && opt.isCorrect;
              return (
                <button
                  key={i}
                  className={`quiz-option ${showCorrect ? 'correct' : ''} ${wasTried ? 'incorrect disabled' : ''} ${canContinue ? 'disabled' : ''}`}
                  onClick={() => handleAnswer(opt)}
                  style={q.type === 'pinyin-to-hanzi' ? { fontFamily: "'Noto Sans SC', sans-serif", fontSize: '32px', textAlign: 'center', justifyContent: 'center' } : {}}
                >
                  {opt.text}
                </button>
              );
            })}
          </div>
          {(attemptedAnswers.length > 0 || canContinue) && (
            <div className="quiz-feedback">
              {answeredCorrect ? (
                <strong>答对了</strong>
              ) : revealedAnswer ? (
                <>
                  <div>正确答案: <strong>{correctOption?.text}</strong></div>
                  <div className="pinyin-display">{q.char.pinyin}</div>
                </>
              ) : (
                <strong>再想一次</strong>
              )}
            </div>
          )}
          {canContinue && (
            <div className="nav-actions">
              <button className="btn btn-primary" onClick={handleNextQuestion}>
                {currentIndex === questions.length - 1 ? '完成' : '下一题 →'}
              </button>
            </div>
          )}
          <p className="text-sm" style={{ textAlign: 'center', marginTop: '20px' }}>得分: {score} / {currentIndex + (canContinue ? 1 : 0)}</p>
        </div>
      );
    }

    // ============================================
    // STATS VIEW
    // ============================================
    function StatsView({ progress, setCurrentView }) {
      const byLesson = [12, 13, 14, 15].map(l => ({
        lesson: l,
        mastered: VOCABULARY.filter(v => v.lesson === l && progress.masteredChars.includes(v.hanzi)).length,
        total: VOCABULARY.filter(v => v.lesson === l).length
      }));
      const recentScores = progress.quizScores.slice(-5).reverse();

      const handleReset = () => {
        if (window.confirm('确定要重置全部学习进度吗？此操作不能撤销。')) {
          localStorage.removeItem(STORAGE_KEY);
          window.location.reload();
        }
      };

      const handleExport = () => {
        const exportData = {
          version: 1,
          exportDate: new Date().toISOString(),
          appName: 'hanzi-master',
          progress: progress
        };
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `hanzi-master-backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            
            // Validate structure
            if (!data.progress || data.appName !== 'hanzi-master') {
              alert('备份文件格式不正确。');
              return;
            }
            
            // Merge with defaults for forward compatibility
            let imported = {
              masteredChars: data.progress.masteredChars || [],
              learningChars: data.progress.learningChars || [],
              quizScores: data.progress.quizScores || [],
              drawingAttempts: data.progress.drawingAttempts || {},
              lastPositions: data.progress.lastPositions || {},
              lastStudyDate: data.progress.lastStudyDate || null,
              streak: data.progress.streak || 0,
              totalReviews: data.progress.totalReviews || 0,
              streakDays: data.progress.streakDays || 0
            };
            
            // Migrate old ID-based backups to hanzi-based
            imported = migrateProgress(imported);
            
            if (window.confirm(`导入 ${new Date(data.exportDate).toLocaleDateString()} 的备份？\n\n这会替换当前学习进度。`)) {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(imported));
              window.location.reload();
            }
          } catch (err) {
            alert('读取备份文件失败。');
          }
        };
        reader.readAsText(file);
        e.target.value = ''; // Reset input
      };

      return (
        <div className="screen">
          <header className="header">
            <button className="back-btn" onClick={() => setCurrentView('home')}>← 返回</button>
            <div className="logo">汉字</div>
          </header>

          <MiniAppHeader
            icon="wallet"
            title="学习钱包"
            subtitle="掌握的字、复习记录和连续学习都存在这里。"
            pill={`${progress.masteredChars.length}/${VOCABULARY.length}`}
          />

          <div className="stats-bar stats-wallet">
            <div className="stat-item">
              <div className="stat-value">{progress.masteredChars.length}</div>
              <div className="stat-label">已掌握</div>
            </div>
            <div className="stat-item">
              <div className="stat-value">{progress.totalReviews}</div>
              <div className="stat-label">复习</div>
            </div>
            <div className="stat-item">
              <div className="stat-value">{progress.streakDays}</div>
              <div className="stat-label">连续</div>
            </div>
          </div>

          <div className="section-title">
            <span className="text-sm">按课程</span>
            <div className="section-line" />
          </div>

          {byLesson.map(({ lesson, mastered, total }) => (
            <div key={lesson} className="card">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <p className="title-md">第 {lesson} 课</p>
                <span className="text-accent" style={{ fontFamily: "'Noto Sans SC', 'Segoe UI', Arial, sans-serif", fontSize: '20px', fontWeight: 900 }}>{mastered}/{total}</span>
              </div>
              <div className="progress-bar" style={{ marginTop: '10px', marginBottom: '0' }}>
                <div className="progress-fill" style={{ width: `${(mastered / total) * 100}%` }} />
              </div>
            </div>
          ))}

          {recentScores.length > 0 && (
            <>
              <div className="section-title">
                <span className="text-sm">最近测验</span>
                <div className="section-line" />
              </div>
              {recentScores.map((q, i) => (
                <div key={i} className="card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span style={{ fontSize: '13px' }}>{new Date(q.date).toLocaleDateString()}</span>
                    <span className="text-accent" style={{ fontFamily: "'Noto Sans SC', 'Segoe UI', Arial, sans-serif", fontSize: '22px', fontWeight: 900 }}>{Math.round((q.score / q.total) * 100)}%</span>
                  </div>
                </div>
              ))}
            </>
          )}

          <div className="section-title">
            <span className="text-sm">全部 {VOCABULARY.length} 个汉字</span>
            <div className="section-line" />
          </div>

          <div className="char-grid">
            {VOCABULARY.map(c => (
              <div key={c.id} className={`char-item ${progress.masteredChars.includes(c.hanzi) ? 'mastered' : progress.learningChars.includes(c.hanzi) ? 'learning' : ''}`} title={`${c.pinyin} - ${c.meaning}`}>
                {c.hanzi}
              </div>
            ))}
          </div>

          <div className="section-title" style={{ marginTop: '28px' }}>
            <span className="text-sm">备份</span>
            <div className="section-line" />
          </div>

          <div className="backup-buttons">
            <button className="btn btn-secondary" onClick={handleExport}>
              <span style={{ marginRight: '8px' }}>📤</span> 导出
            </button>
            <label className="btn btn-secondary" style={{ cursor: 'pointer' }}>
              <span style={{ marginRight: '8px' }}>📥</span> 导入
              <input type="file" accept=".json" onChange={handleImport} style={{ display: 'none' }} />
            </label>
          </div>

          <div style={{ marginTop: '20px' }}>
            <button className="btn btn-coral" onClick={handleReset}>重置进度</button>
          </div>
        </div>
      );
    }

    // ============================================
    // MOUNT
    // ============================================
    document.body.classList.add('app-ready');
    ReactDOM.createRoot(document.getElementById('root')).render(<HanziMasterApp />);
  </script>
</body>
</html>
