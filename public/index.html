<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#e8f7ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>汉字大师 | HSK1 小程序</title>
  <meta name="description" content="Learn Chinese characters with flashcards, drawing practice, and quizzes. HSK1 vocabulary from lessons 12-15.">
  
  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='16' y1='12' x2='84' y2='88'><stop stop-color='%2307c160'/><stop offset='1' stop-color='%231677ff'/></linearGradient></defs><rect x='8' y='8' width='84' height='84' rx='24' fill='url(%23g)'/><rect x='19' y='19' width='62' height='62' rx='17' fill='white' opacity='.12'/><text x='50' y='68' text-anchor='middle' font-family='Noto Sans SC, Microsoft YaHei, sans-serif' font-size='54' font-weight='900' fill='white'>字</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='16' y1='12' x2='84' y2='88'><stop stop-color='%2307c160'/><stop offset='1' stop-color='%231677ff'/></linearGradient></defs><rect x='8' y='8' width='84' height='84' rx='24' fill='url(%23g)'/><rect x='19' y='19' width='62' height='62' rx='17' fill='white' opacity='.12'/><text x='50' y='68' text-anchor='middle' font-family='Noto Sans SC, Microsoft YaHei, sans-serif' font-size='54' font-weight='900' fill='white'>字</text></svg>">
  
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    
    html, body, #root {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }
    
    body {
      background: #e8f7ef;
      color: #18212b;
      font-family: 'Noto Sans SC', 'Segoe UI', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }
    
    /* Prevent pull-to-refresh on mobile */
    body {
      overscroll-behavior-y: contain;
    }
    
    /* Safe area for notched phones */
    @supports (padding: max(0px)) {
      body {
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
      }
    }
    
    /* ===== LOADING SCREEN ===== */
    .loading-screen {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 22% 12%, rgba(7, 193, 96, 0.18), transparent 30%),
        radial-gradient(circle at 88% 18%, rgba(22, 119, 255, 0.15), transparent 28%),
        linear-gradient(180deg, #e8f7ef 0%, #f7fbf8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
    }

    .loading-screen::before {
      content: "字";
      position: absolute;
      right: max(14px, 12vw);
      top: 16%;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: clamp(120px, 34vw, 220px);
      font-weight: 900;
      color: rgba(7, 193, 96, 0.06);
      line-height: 1;
      pointer-events: none;
    }

    .loading-card {
      position: relative;
      z-index: 1;
      width: min(320px, calc(100vw - 48px));
      padding: 30px 22px 24px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(24, 33, 43, 0.06);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 46px rgba(20, 49, 35, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .loading-logo {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      filter: drop-shadow(0 14px 20px rgba(7, 193, 96, 0.18));
      animation: loadingPulse 2.8s ease-in-out infinite;
    }

    .loading-logo svg {
      width: 92px;
      height: 92px;
      display: block;
    }
    
    .loading-text {
      margin-top: 2px;
      font-size: 18px;
      color: #14251c;
      font-weight: 900;
      letter-spacing: 0;
    }

    .loading-subtext {
      color: #687870;
      font-size: 13px;
      font-weight: 700;
    }

    .loading-dots {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .loading-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #07c160;
      animation: loadingBlink 1.2s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.16s;
      background: #1677ff;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.32s;
      background: #ffcf33;
    }
    
    @keyframes loadingPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }
    
    @keyframes loadingBlink {
      0%, 100% { transform: translateY(0); opacity: 0.45; }
      50% { transform: translateY(-4px); opacity: 1; }
    }
    
    .app-ready .loading-screen {
      display: none;
    }
    
    /* Selection color */
    ::selection {
      background: #07c160;
      color: #ffffff;
    }
    
    /* Focus visible for accessibility */
    :focus-visible {
      outline: 3px solid #1677ff;
      outline-offset: 2px;
    }
    
    /* Remove default button styles */
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-screen">
      <div class="loading-card">
        <div class="loading-logo" aria-hidden="true">
          <svg width="92" height="92" viewBox="0 0 92 92" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="76" height="76" rx="22" fill="url(#loadingLogoGradient)"/>
            <rect x="18" y="18" width="56" height="56" rx="16" fill="white" opacity="0.12"/>
            <text x="46" y="61" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="47" font-weight="900" fill="white">&#23383;</text>
            <defs>
              <linearGradient id="loadingLogoGradient" x1="8" y1="8" x2="84" y2="84" gradientUnits="userSpaceOnUse">
                <stop stop-color="#07C160"/>
                <stop offset="1" stop-color="#1677FF"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="loading-text">Hanzi Master</div>
        <div class="loading-subtext">Preparing your lesson</div>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  
  <script src="app.js"></script>
</body>
</html>
