  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    
    html, body {
      width: 100%;
      min-height: 100%;
      /* clip (not hidden) keeps vertical scrolling working on mobile */
      overflow-x: clip;
    }

    #root {
      min-height: 100%;
    }
    
    body {
      background: #f8f5ef;
      color: #18212b;
      font-family: 'Microsoft YaHei', 'PingFang SC', 'Segoe UI', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }
    
    /* Prevent pull-to-refresh on mobile */
    body {
      overscroll-behavior-y: contain;
    }
    
    /* Safe area for notched phones */
    @supports (padding: max(0px)) {
      body {
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
      }
    }
    
    /* ===== LOADING SCREEN ===== */
    .loading-screen {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 22% 12%, rgba(200, 55, 31, 0.10), transparent 30%),
        radial-gradient(circle at 88% 18%, rgba(25, 23, 19, 0.08), transparent 28%),
        linear-gradient(180deg, #f8f5ef 0%, #f3eee2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
    }

    

    .loading-card {
      position: relative;
      z-index: 1;
      width: min(320px, calc(100vw - 48px));
      padding: 30px 22px 24px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(24, 33, 43, 0.06);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 46px rgba(25, 23, 19, 0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .loading-logo {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      filter: drop-shadow(0 14px 20px rgba(200, 55, 31, 0.10));
      animation: loadingPulse 2.8s ease-in-out infinite;
    }

    .loading-logo svg {
      width: 92px;
      height: 92px;
      display: block;
    }
    
    .loading-text {
      margin-top: 2px;
      font-size: 18px;
      color: #14251c;
      font-weight: 900;
      letter-spacing: 0;
    }

    .loading-subtext {
      color: #687870;
      font-size: 13px;
      font-weight: 700;
    }

    .loading-bar {
      width: 120px;
      height: 3px;
      margin-top: 14px;
      background: rgba(25, 23, 19, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar span {
      display: block;
      width: 40%;
      height: 100%;
      background: #c8371f;
      border-radius: 2px;
      animation: loadingSlide 1.1s ease-in-out infinite;
    }

    @keyframes loadingSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
    
    @keyframes loadingPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }
    
    @keyframes loadingBlink {
      0%, 100% { transform: translateY(0); opacity: 0.45; }
      50% { transform: translateY(-4px); opacity: 1; }
    }
    
    .app-ready .loading-screen {
      display: none;
    }
    
    /* Selection color */
    ::selection {
      background: #c8371f;
      color: #ffffff;
    }
    
    /* Focus visible for accessibility */
    :focus-visible {
      outline: 3px solid #191713;
      outline-offset: 2px;
    }
    
    /* Remove default button styles */
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-screen">
      <div class="loading-card">
        <div class="loading-logo" aria-hidden="true">
          <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="84" height="84" rx="14" fill="#c8371f"/>
            <path d="M28 66 C 30 46, 44 32, 58 34 C 70 36, 72 50, 62 56 C 54 61, 44 58, 42 50" stroke="#fffdf8" stroke-width="9" stroke-linecap="round" fill="none"/>
            <circle cx="66" cy="30" r="4.5" fill="#fffdf8"/>
          </svg>
        </div>
        <div class="loading-text">Hanzi Master</div>
        <div class="loading-subtext">Preparing your lesson</div>
        <div class="loading-bar"><span></span></div>
      </div>
    </div>
  </div>
